# The model registry (ADR 0014). To test another model on a known API, add one entry.
# Then: itemizer compare-models --models claude-opus-5-5,<your entry> --set train --limit 30
#
# provider:  anthropic | ollama | openai_compatible
# Prices are USD per million tokens, and every number the tool reports is computed from them.
# Claude prices are the first-party list prices as of 2026-10-06. Check them before relying on a cost figure.
default: claude-opus-5-5

models:
  # Separate paid evaluation; pinned snapshot/rates checked in official documentation 2026-11-05.
  # https://developers.openai.com/api/docs/models/gpt-5.4-mini
  # independent.py enforces a persistent authorized allowance through the paid transport.
  openai-gpt-5.4-mini:
    provider: openai_compatible
    model: gpt-5.4-mini-2026-03-17
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY
    effort: medium
    max_tokens: 16000
    temperature: null
    refusal_fallback: false
    input_usd_per_mtok: "0.75"
    output_usd_per_mtok: "4.50"
    cache_read_usd_per_mtok: "0.075"
    cache_write_usd_per_mtok: "0"

  # Separate candidate selected for its account quota, not from benchmark scores.
  gemini-3.5-flash-lite-free:
    provider: openai_compatible
    model: gemini-3.5-flash-lite
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: GEMINI_API_KEY
    effort: medium
    max_tokens: 16000
    temperature: 0
    refusal_fallback: false
    input_usd_per_mtok: "0"
    output_usd_per_mtok: "0"
    cache_read_usd_per_mtok: "0"
    cache_write_usd_per_mtok: "0"

  gemini-3-flash-preview-free:
    provider: openai_compatible
    model: gemini-3-flash-preview
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: GEMINI_API_KEY
    effort: medium
    max_tokens: 16000
    temperature: 0
    refusal_fallback: false
    input_usd_per_mtok: "0"
    output_usd_per_mtok: "0"
    cache_read_usd_per_mtok: "0"
    cache_write_usd_per_mtok: "0"

  # Free-tier experiment only; zero rates describe the selected free quota, not paid-tier list prices.
  # Official pricing checked 2026-11-05: https://ai.google.dev/gemini-api/docs/pricing#gemini-3.8-flash
  gemini-3.8-flash-free:
    provider: openai_compatible
    model: gemini-3.8-flash
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: GEMINI_API_KEY
    effort: medium
    max_tokens: 16000
    temperature: 0
    refusal_fallback: false
    input_usd_per_mtok: "0"
    output_usd_per_mtok: "0"
    cache_read_usd_per_mtok: "0"
    cache_write_usd_per_mtok: "0"

  claude-opus-5-5:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: CLAUDE_API_KEY
    effort: medium
    refusal_fallback: true
    input_usd_per_mtok: "4.00"
    output_usd_per_mtok: "20.00"
    cache_read_usd_per_mtok: "0.20"
    cache_write_usd_per_mtok: "5.00"

  claude-sonnet-5-5:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key_env: CLAUDE_API_KEY
    effort: medium
    refusal_fallback: true
    input_usd_per_mtok: "2.00"
    output_usd_per_mtok: "10.00"
    cache_read_usd_per_mtok: "0.20"
    cache_write_usd_per_mtok: "2.50"

  claude-haiku-5-5:
    provider: anthropic
    model: claude-haiku-5-5
    api_key_env: CLAUDE_API_KEY
    effort: medium
    refusal_fallback: false
    input_usd_per_mtok: "0.10"
    output_usd_per_mtok: "0.50"
    cache_read_usd_per_mtok: "0.01"
    cache_write_usd_per_mtok: "0.125"

  # The labellers for `gt draft-test-labels` (ADR 0015). With no refusal fallback, every label really is from Opus.
  claude-opus-5-5-label-high:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: CLAUDE_API_KEY
    effort: high
    refusal_fallback: false
    input_usd_per_mtok: "4.00"
    output_usd_per_mtok: "20.00"
    cache_read_usd_per_mtok: "0.20"
    cache_write_usd_per_mtok: "5.00"

  claude-opus-5-5-label-xhigh:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: CLAUDE_API_KEY
    effort: xhigh
    refusal_fallback: false
    input_usd_per_mtok: "4.00"
    output_usd_per_mtok: "20.00"
    cache_read_usd_per_mtok: "0.20"
    cache_write_usd_per_mtok: "5.00"

  # Kimi K3 only accepts its default temperature, so temperature is null here. Moonshot's own price table would not load on
  # 2026-11-04: these are the rates most listings give ($3, $0.30, $15), so treat a cost figure as an estimate and check it.
  kimi-k3:
    provider: openai_compatible
    model: kimi-k3
    base_url: "https://api.moonshot.ai/v1"
    api_key_env: MOONSHOT_API_KEY
    effort: medium
    temperature: null
    refusal_fallback: false
    input_usd_per_mtok: "3.00"
    output_usd_per_mtok: "15.00"
    cache_read_usd_per_mtok: "0.30"
    cache_write_usd_per_mtok: "3.00"

  # Examples for other providers. They run once the runtime or key exists.
  local-qwen:
    provider: ollama
    model: "qwen3:14b"
    base_url: "http://localhost:11434"
    refusal_fallback: false
    input_usd_per_mtok: "0"
    output_usd_per_mtok: "0"
    cache_read_usd_per_mtok: "0"
    cache_write_usd_per_mtok: "0"

  openai-compatible-example:
    provider: openai_compatible
    model: "name-of-the-model"
    base_url: "https://api.example.com/v1"
    api_key_env: OTHER_API_KEY
    refusal_fallback: false
    input_usd_per_mtok: "0"
    output_usd_per_mtok: "0"
    cache_read_usd_per_mtok: "0"
    cache_write_usd_per_mtok: "0"
