[project]
name = "itemizer"
version = "0.1.0"
description = "Freight Invoice Itemizer: turns free-text dispute notes into itemized, evidence-backed charges."
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.13",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
llm = ["anthropic>=2.4"]
ui = ["fastapi>=0.115", "jinja2>=3.1", "python-multipart>=0.0.18", "uvicorn>=0.32"]

[dependency-groups]
dev = ["pytest>=8.0", "anthropic>=2.4", "fastapi>=0.115", "jinja2>=3.1", "python-multipart>=0.0.18", "uvicorn>=0.32", "httpx>=0.27"]

[project.scripts]
itemizer = "itemizer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itemizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
